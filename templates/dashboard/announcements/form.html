{% extends 'base/dashboard_base.html' %}
{% block page_name %}إعلان الشريط{% endblock %}

{% block content %}
<div class="page-head">
  <div><h2>{% if object %}تعديل الإعلان{% else %}إعلان جديد{% endif %}</h2></div>
  <a class="btn btn-ghost" href="{% url 'dash_announcements' %}">رجوع</a>
</div>

<form method="post" style="max-width:680px">
  {% csrf_token %}
  <div class="card">
    {% include 'dashboard/_form_fields.html' %}
    <button class="btn" type="submit">حفظ</button>
  </div>
</form>
{% endblock %}
