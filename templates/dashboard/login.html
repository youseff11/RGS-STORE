{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول لوحة التحكم — {{ SITE.brand_name|default:"MR" }}</title>
  {% if SITE.favicon %}<link rel="icon" href="{{ SITE.favicon.url }}">{% else %}<link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Jost:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <meta name="theme-color" content="#0E0C0B">
  <meta name="robots" content="noindex">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post">
    {% csrf_token %}
    <h1 class="login-logo">{% include 'partials/logo.html' %}</h1>
    <p>لوحة تحكم المتجر</p>

    {% if error %}<div class="alert">{{ error }}</div>{% endif %}

    <div class="field">
      <label>اسم المستخدم</label>
      <input class="inp" type="text" name="username" autofocus required>
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input class="inp" type="password" name="password" required>
    </div>

    <button class="btn btn-block" type="submit" style="margin-top:8px">دخول</button>

    <div style="text-align:center;margin-top:18px">
      <a href="{% url 'home' %}" class="small muted">← الرجوع للمتجر</a>
    </div>
  </form>
</div>
<script src="{% static 'js/dashboard.js' %}"></script>
</body>
</html>
