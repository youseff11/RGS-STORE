{% extends 'base/base.html' %}
{% load store_tags %}

{% block content %}
<section class="page-hero">
  <div class="wrap">
    <div class="crumbs"><a href="{% url 'home' %}">{% t 'home' %}</a> <span>/</span> <span>{% t 'about' %}</span></div>
    <h1>{% t 'about' %}</h1>
    <p>{{ SITE.tagline }}</p>
  </div>
</section>

<section class="section-sm">
  <div class="wrap" style="max-width:820px">
    <div class="form-card">
      <p style="white-space:pre-line;font-size:15px;color:var(--text-2);margin:0">{{ SITE.about|default:SITE.tagline }}</p>
    </div>
  </div>
</section>
{% endblock %}
