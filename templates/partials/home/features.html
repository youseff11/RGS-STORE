<section class="usp">
  <div class="wrap usp-grid">
    {% for item in items %}
    <div class="usp-item">
      <span class="usp-icon">{% include 'partials/icon.html' with name=item.icon %}</span>
      <div><h4>{{ item.title }}</h4><p>{{ item.text }}</p></div>
    </div>
    {% endfor %}
  </div>
</section>
